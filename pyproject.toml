[project]
name = "agent-kanban"
version = "0.2.0"
description = "Local-first kanban for AI-agent workflows. SQLite, FastAPI, no auth, no cloud."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "agent-kanban contributors" }]
keywords = [
    "kanban",
    "mcp",
    "ai-agent",
    "claude-code",
    "cline",
    "cursor",
    "local-first",
    "self-hosted",
    "fastapi",
    "sqlite",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "mcp>=1.0",
    "PyYAML>=6.0",
    "fastapi-mcp>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/nerkoman/agent-kanban"
Repository = "https://github.com/nerkoman/agent-kanban"
Issues = "https://github.com/nerkoman/agent-kanban/issues"

[tool.uv]
# We're not a PyPI-publishable package — just managed deps + an entry point.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
